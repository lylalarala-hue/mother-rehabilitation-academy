<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>確認テスト｜産前産後リハビリアカデミー</title>
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   ★ このDAYで編集するのは、下の CONFIG と QUESTIONS だけ ★
   ── 見た目・採点・記録のロジックは assets/quiz.js が担当します。
      新しいDAYを作るときは、このファイルを day2.html などに複製し、
      下の2か所（CONFIG / QUESTIONS）を差し替えてください。

   ※ 選択肢の並び順は読み込みのたびにシャッフルされ、正答の位置
      （A〜D）はランダムになります。QUESTIONS では正答を先頭
      （配列の0番目）に書いておけばOKです（answer は自動で追従）。
   ============================================================ */
window.QUIZ = (function () {

const CONFIG = {
  day:        "DAY 1",
  title:      "産前産後の基礎と評価",
  passRatio:  1.0,          // 合格ライン（1.0 = 100%。例：0.8 にすると8割正解で合格）
  isSample:   false,        // 本番問題
  // ▼ Apps Script を公開した「ウェブアプリURL」をここに貼る（未設定なら記録はスキップ）
  endpoint:   "https://script.google.com/macros/s/AKfycbw92xxGrnPwqDltsANabnVT67SQQKvEK06SO_dwPIWTa8DFITuuUKDO2SA6ubbLFX0jOg/exec"
};

/* 各問：options の先頭（0番目）が正答。並び順は下でシャッフルします。 */
const QUESTIONS_RAW = [
  // ── MRアカデミー Day1（総論）3問 ──
  { tag:"患者理解",
    q:"産前産後リハで意識したい「良くなった」の捉え方のズレについて、適切なものはどれか。",
    options:[
      "医師は所見や数値、セラピストは動作やADL、患者は「抱っこしても痛くない」など立場で基準が異なり、患者の本当のゴールを拾うことが大切",
      "三者の基準は一致しており、ズレを気にする必要はない",
      "患者の主観は当てにならないため、画像所見だけで判断する",
      "共感と安心が最優先で、主訴を解決する知識や技術は二の次でよい"],
    answer:0,
    expl:"「良くなった」の捉え方は立場で異なります。患者の言葉の裏にある本当のゴールを拾うことが大切。ただし大前提として、主訴を解決に近づける知識と技術があること（共感だけでは不十分）。" },

  { tag:"リスク管理",
    q:"セラピストが自分で判断せず、医師に判断を求めるべき状態はどれか。",
    options:[
      "腹痛の増悪、発熱、出血、浮腫の急な変化や、精神症状の出現や悪化",
      "軽い筋肉痛や一時的な疲労感",
      "リハ中の軽度な発汗",
      "自宅での運動回数のわずかな増減"],
    answer:0,
    expl:"腹痛増悪・発熱・出血・浮腫の急変や精神症状は「自分で判断しない勇気」を持つべきサイン。状態変化は即日・所見（事実）ベースで簡潔に報告します。" },

  { tag:"多職種連携",
    q:"チーム医療の一員としての行動として、最も適切なものはどれか。",
    options:[
      "やりすぎない判断を持ち、状態変化は当日中に所見ベースで医師や助産師に報告し、報告ラインを事前に確認しておく",
      "専門家として、気になる所見も自分一人で判断し抱え込む",
      "患者の不安を抑えるため、医師の説明と異なる見解も積極的に伝える",
      "産婦人科医や助産師との連携は、問題が起きてから始める"],
    answer:0,
    expl:"「技術の前に、安全管理とチームの一員である自覚」。状態変化は即日・所見ベースで報告し、患者への言葉も医師と統一。単独で抱え込まないことが信頼につながります。" },

  // ── 第1回ウェビナー①（妊娠期の変化とリスク管理）4問 ──
  { tag:"妊娠期の変化",
    q:"妊娠後期の呼吸や体幹に関わる変化として正しいものはどれか。",
    options:[
      "子宮の増大で横隔膜が約4cm挙上し、胸式呼吸が優位になる",
      "横隔膜は下降し、腹式呼吸が優位になる",
      "肋骨下角は狭くなる",
      "残気量が増加する"],
    answer:0,
    expl:"子宮増大で横隔膜は約4cm挙上し胸式呼吸が優位に。肋骨は横方向に広がり肋骨下角は拡大、呼吸数は増加・残気量は低下します。横隔膜はインナーユニットの一部で、体幹評価の臨床推論の基盤になります。" },

  { tag:"各時期の特徴",
    q:"妊娠24週の妊婦について、時期の区分と注意すべき異常の組み合わせで正しいものはどれか。",
    options:[
      "妊娠中期（7か月）で、切迫早産や妊娠高血圧症候群、妊娠糖尿病などに注意する",
      "妊娠初期で、異所性妊娠に最も注意する",
      "妊娠後期で、過期産に注意する",
      "妊娠中期だが、特に注意すべき異常はない"],
    answer:0,
    expl:"妊娠初期0〜15週／中期16〜27週／後期28〜40週。24週は中期（7か月）です。22週以降は早産の範疇で、妊娠高血圧症候群や妊娠糖尿病にも注意が必要です。" },

  { tag:"リスク管理",
    q:"妊婦へのリハ開始前や実施中の安全管理として、適切なものはどれか。",
    options:[
      "開始前にかかりつけ産婦人科医の許可を確認し、毎回、胎動や出血、お腹の張り、破水感、バイタルを確認する",
      "切迫流早産や前置胎盤の既往があっても、本人が希望すれば開始してよい",
      "経過が順調なら、胎動や出血の確認は省略してよい",
      "お腹の張りや軽い出血は様子を見て、リハは予定どおり続ける"],
    answer:0,
    expl:"切迫流早産・妊娠高血圧症・前置胎盤・子宮頸管無力症などで運動禁止とされていないかを確認。毎回、胎動・出血・お腹の張り・破水感・バイタル（血圧・脈拍・体温）を確認し、異常時は中止して即日報告します。" },

  { tag:"リスク管理",
    q:"妊娠中の臥位姿勢について正しいものはどれか。",
    options:[
      "仰臥位で子宮が下大静脈を圧迫すると仰臥位低血圧症候群を生じうるため、症状が出そうなら左側臥位にする",
      "仰臥位低血圧症候群が出たら右側臥位にする",
      "腹臥位は補助具を使えば後期でも負担なく行える",
      "仰臥位は血圧を上げるため、積極的に長くとる"],
    answer:0,
    expl:"下大静脈は脊柱の右前方を走行。圧迫で静脈還流が低下し血圧低下（めまい・気分不良・冷や汗など）を生じます。症状が出そうなら左側臥位へ。腹臥位は補助具を使っても子宮内圧上昇・背部負担がかかるため避けます。" },

  // ── 第1回事前ウェビナー②（出産〜産後の変化）3問 ──
  { tag:"分娩",
    q:"会陰裂傷の分類について正しいものはどれか。",
    options:[
      "第3度は肛門括約筋の断裂を、第4度は肛門や直腸粘膜への裂傷を伴い、いずれも手術的修復を要する",
      "第2度は会陰皮膚と膣粘膜のみに限局し、自然治癒は望めない",
      "第3度は筋層までの裂傷にとどまり、第4度で初めて肛門括約筋に及ぶ",
      "第4度は直腸粘膜には及ばず、骨盤臓器脱のリスクとも関係しない"],
    answer:0,
    expl:"第1度＝会陰皮膚・膣粘膜に限局、第2度＝筋層も裂傷、第3度＝肛門括約筋断裂、第4度＝肛門・直腸粘膜に及ぶ。第1・2度は自然治癒可能、第3・4度は手術的修復が必要で、尿・便失禁や骨盤臓器脱のリスクが高まります。" },

  { tag:"産褥期",
    q:"産褥期の姿勢や動作の指導として、最も適切なものはどれか。",
    options:[
      "体幹の支持性が乏しいまま育児動作を続けると不良姿勢から二次的な痛みや骨盤底への負荷を招くため、痛みを避ける姿勢や臥位ポジショニング、寝返り、授乳姿勢などを指導する",
      "子宮復古が完了する産褥6〜8週までは臥床安静を厳守させ、起き上がりや授乳姿勢の指導は控える",
      "悪露が続く時期は座位や排便姿勢の指導を産褥6週以降まで行わない",
      "体幹の支持性を早く取り戻すため、産褥早期から強い腹圧をかける体幹トレーニングを優先する"],
    answer:0,
    expl:"産褥期の終了は身体の完全回復を意味しません。早期から疼痛回避と骨盤底保護の視点で、臥位ポジショニング・寝返り・起き上がり・座位・授乳・排便姿勢などを指導します。" },

  { tag:"産後の変化",
    q:"腹直筋離開（DRA）について正しいものはどれか。",
    options:[
      "臨床上は2横指以上の離開でDRAと判断し、妊娠後期にほぼ全妊婦で生じ、産後6か月でも約39%以上に残存する",
      "1横指以上の離開からDRAと診断し、産後6か月までにほぼ全例で消失する",
      "妊娠中に生じることは少なく、主に分娩時の腹圧で発症して産後に表れる",
      "白線の離開幅が大きいほど、腰痛や骨盤底機能障害の重症度と必ず比例する"],
    answer:0,
    expl:"判断基準は2横指以上。妊娠後期にほぼ全妊婦で生じ、産後6か月でも約39%以上に残存します。白線は腹筋群のアンカーで、離開すると腹壁機能が低下しますが、症状の原因かは総合的に判断します。" }
];

/* 選択肢の並び順をシャッフルし、正答の位置（A〜D）をランダム化する。
   正答テキストを保持したまま options を並べ替え、answer をその位置に更新。 */
function shuffleChoices(list){
  return list.map(function(item){
    const order = item.options.map(function(_, i){ return i; });
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    return {
      tag: item.tag,
      q: item.q,
      options: order.map(function(i){ return item.options[i]; }),
      answer: order.indexOf(item.answer),
      expl: item.expl
    };
  });
}

const QUESTIONS = shuffleChoices(QUESTIONS_RAW);

  return { config: CONFIG, questions: QUESTIONS };
})();
</script>
<script src="assets/quiz.js"></script>
</body>
</html>
