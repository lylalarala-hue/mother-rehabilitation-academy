/* 配列をシャッフル（Fisher–Yates） */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* プールから draw 問をランダム抽出（出題はプールの並び順＝カリキュラム順）し、
   各問の選択肢をシャッフルして正答位置をランダム化する。 */
function buildQuestions(pool, draw){
  const n = Math.min(draw, pool.length);
  const chosenIdx = shuffle(pool.map(function(_, i){ return i; })).slice(0, n).sort(function(a, b){ return a - b; });
  return chosenIdx.map(function(pi){
    const item = pool[pi];
    const order = shuffle(item.options.map(function(_, i){ return i; }));
    return {
      tag: item.tag,
      q: item.q,
      options: order.map(function(i){ return item.options[i]; }),
      answer: order.indexOf(item.answer),
      expl: item.expl
    };
  });
}

const QUESTIONS = buildQuestions(QUESTIONS_POOL, DRAW);

  return { config: CONFIG, questions: QUESTIONS };
