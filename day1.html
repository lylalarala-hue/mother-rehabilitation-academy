<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>確認テスト｜産前産後リハビリアカデミー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/quiz.css">
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   ★ このDAYで編集するのは、下の CONFIG と QUESTIONS だけ ★
   ── 見た目・採点・記録のロジックは assets/quiz.js が担当します。
      新しいDAYを作るときは、このファイルを day2.html などに複製し、
      下の2か所（CONFIG / QUESTIONS）を差し替えてください。
   ============================================================ */
window.QUIZ = (function () {

const CONFIG = {
  day:        "DAY 1",
  title:      "産前産後の基礎と評価",
  passRatio:  1.0,          // 合格ライン（1.0 = 100%）
  // ▼ Apps Script を公開した「ウェブアプリURL」をここに貼る（未設定なら記録はスキップ）
  endpoint:   "https://script.google.com/macros/s/AKfycbw92xxGrnPwqDltsANabnVT67SQQKvEK06SO_dwPIWTa8DFITuuUKDO2SA6ubbLFX0jOg/exec"
};

const QUESTIONS = [
  { tag:"基礎",
    q:"正期産（フルターム）に該当する妊娠週数はどれですか？",
    options:["妊娠 34週0日〜36週6日","妊娠 37週0日〜41週6日","妊娠 42週0日以降"],
    answer:1,
    expl:"正期産は37週0日〜41週6日。37週未満は早産、42週以降は過期産に分類されます。" },

  { tag:"基礎",
    q:"妊娠中に分泌が増加し、靭帯の弛緩や関節弛緩性に関与するホルモンはどれですか？",
    options:["インスリン","リラキシン","コルチゾール"],
    answer:1,
    expl:"リラキシンは骨盤周囲をはじめとする靭帯の弛緩に関与し、関節の不安定性に影響します。" },

  { tag:"姿勢・動作",
    q:"妊娠・産後の姿勢変化のとらえ方として、最も適切なものはどれですか？",
    options:["全員に共通の決まったパターンに当てはめて評価する","個人差が大きいため、個別に評価する","姿勢変化は起こらないため評価は不要"],
    answer:1,
    expl:"姿勢変化には個人差が大きく、一律のパターン化は禁物。個別評価が基本です。" },

  { tag:"リスク管理",
    q:"運動中にただちに中止し、医療者に連絡すべき所見はどれですか？",
    options:["軽い倦怠感","性器出血・持続する腹痛・強いめまい","軽度の筋肉痛"],
    answer:1,
    expl:"性器出血、持続する腹痛、強いめまい等はレッドフラッグ。直ちに中止し医療者へ連絡します。" },

  { tag:"リスク管理",
    q:"産後の運動再開について、正しいものはどれですか？",
    options:["分娩様式や経過にかかわらず、全員同じ時期に開始してよい","経腟・帝王切開の別や回復経過に応じて、個別に判断する","産後はいかなる運動も6か月間禁止である"],
    answer:1,
    expl:"分娩様式・出血・創部・回復経過などにより、再開時期と強度は個別に判断します。" },

  { tag:"リスク管理",
    q:"妊娠中に仰臥位を長時間とることを避ける主な理由はどれですか？",
    options:["腰痛が必ず悪化するため","増大した子宮が下大静脈を圧迫し、仰臥位低血圧症候群を起こしうるため","呼吸ができなくなるため"],
    answer:1,
    expl:"増大子宮による下大静脈圧迫で血圧低下（仰臥位低血圧症候群）が起こりうるため、長時間の仰臥位は避けます。" },

  { tag:"評価",
    q:"腹直筋離開（DRA）の評価で主に確認する指標はどれですか？",
    options:["白線部に指が入る幅（離開幅）","下肢の長さの左右差","握力の値"],
    answer:0,
    expl:"白線部の離開幅（指何本分入るか）や深さ、収縮時の変化を確認します。" },

  { tag:"評価",
    q:"骨盤底筋トレーニングの指導で、まず重要なことはどれですか？",
    options:["できるだけ強く長く力を入れさせる","正しい収縮（締める・持ち上げる感覚）を確認・指導する","回数を毎日増やし続ける"],
    answer:1,
    expl:"誤った力み（息こらえ・代償）を防ぐため、まず正しい収縮の確認・指導が最優先です。" },

  { tag:"姿勢・動作",
    q:"抱っこなどの育児動作で腰部への負担を減らす基本はどれですか？",
    options:["対象物を体から離して持ち上げる","対象物を体に近づけ、下肢を使って持ち上げる","上半身だけを使って素早く持ち上げる"],
    answer:1,
    expl:"対象を体幹に近づけ、股関節・膝を使って持ち上げると腰部負担を軽減できます。" },

  { tag:"基礎",
    q:"本アカデミーが目指すゴールとして、ページに示されているものはどれですか？",
    options:["高リスク妊婦の周産期管理ができる","中リスク（中程度の症状）の産前産後患者のリハビリができる","手術を執刀できる"],
    answer:1,
    expl:"「中リスクの産前産後患者のリハビリができる」状態を目指す、と明示されています。" }
];

  return { config: CONFIG, questions: QUESTIONS };
})();
</script>
<script src="assets/quiz.js"></script>
</body>
</html>
