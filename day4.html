/* 配列をシャッフルして先頭 n 件を返す（出題する問題をランダムに抽出） */
function pickN(list, n){
  const arr = list.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr.slice(0, Math.min(n, arr.length));
}

/* 選択肢の並び順をシャッフルし、正答の位置（A〜D）をランダム化する。
   正答テキストを保持したまま options を並べ替え、answer をその位置に更新。 */
function shuffleChoices(list){
  return list.map(function(item){
    const order = item.options.map(function(_, i){ return i; });
    for(let i = order.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    return {
      tag: item.tag,
      q: item.q,
      options: order.map(function(i){ return item.options[i]; }),
      answer: order.indexOf(item.answer),
      expl: item.expl
    };
  });
}

/* 20問から PICK 問をランダム抽出 → 各問の選択肢もシャッフル */
const QUESTIONS = shuffleChoices(pickN(QUESTIONS_RAW, PICK));

  return { config: CONFIG, questions: QUESTIONS };
